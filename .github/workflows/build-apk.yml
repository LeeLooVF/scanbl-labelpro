name: Build OptiStock Pro APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Récupération du code source
        uses: actions/checkout@v4

      - name: 2. Installation de Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Installation de Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Préparation du dossier web et installation Capacitor
        run: |
          mkdir -p www
          cp index.html www/index.html
          npm install

      - name: 5. Génération et synchronisation du projet Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: 6. Application de l'icône et des permissions Android
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          
          find android/app/src/main/res -name "ic_launcher*.xml" -delete

          if [ ! -f "icon.png" ]; then
            cat << 'EOF' > icon.svg
          <svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
            <defs>
              <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#090d16"/>
                <stop offset="100%" stop-color="#0f172a"/>
              </linearGradient>
              <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#06b6d4"/>
                <stop offset="100%" stop-color="#10b981"/>
              </linearGradient>
            </defs>
            <rect width="512" height="512" rx="115" fill="url(#bg)"/>
            <rect x="36" y="36" width="440" height="440" rx="95" fill="none" stroke="url(#accent)" stroke-width="10" stroke-opacity="0.45"/>
            <rect x="120" y="96" width="272" height="320" rx="28" fill="#1e293b" stroke="#38bdf8" stroke-width="8"/>
            <rect x="160" y="150" width="192" height="20" rx="10" fill="#94a3b8"/>
            <rect x="160" y="195" width="140" height="20" rx="10" fill="#94a3b8"/>
            <rect x="160" y="310" width="24" height="65" fill="#f8fafc"/>
            <rect x="200" y="310" width="12" height="65" fill="#f8fafc"/>
            <rect x="228" y="310" width="32" height="65" fill="#f8fafc"/>
            <rect x="276" y="310" width="14" height="65" fill="#f8fafc"/>
            <rect x="306" y="310" width="22" height="65" fill="#f8fafc"/>
            <rect x="340" y="310" width="12" height="65" fill="#f8fafc"/>
            <rect x="64" y="250" width="384" height="14" rx="7" fill="url(#accent)"/>
          </svg>
          EOF
            convert -background none icon.svg -resize 512x512 icon.png
          fi

          for dir in android/app/src/main/res/mipmap-*; do
            if [ -d "$dir" ]; then
              rm -f "$dir/ic_launcher.webp" "$dir/ic_launcher_round.webp" "$dir/ic_launcher_foreground.webp"
              convert icon.png -resize 192x192 "$dir/ic_launcher.png"
              convert icon.png -resize 192x192 "$dir/ic_launcher_round.png"
              convert icon.png -resize 432x432 "$dir/ic_launcher_foreground.png"
            fi
          done

          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "android.permission.CAMERA" "$MANIFEST"; then
            sed -i '/<application/i \    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />\n    <uses-permission android:name="android.permission.BLUETOOTH" />\n    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />\n    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />' "$MANIFEST"
          fi

          if [ -f "android/variables.gradle" ]; then
            sed -i 's/targetSdkVersion = [0-9]*/targetSdkVersion = 34/g' android/variables.gradle
          fi

          MAIN_ACT=$(find android/app/src/main/java -name "MainActivity.java" | head -n 1)
          if [ -n "$MAIN_ACT" ]; then
            PKG_LINE=$(head -n 1 "$MAIN_ACT")
            cat << EOF > "$MAIN_ACT"
          $PKG_LINE

          import android.Manifest;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.BridgeActivity;
          import java.util.ArrayList;
          import java.util.List;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  SharedPreferences prefs = getSharedPreferences("OptiStockPerms", MODE_PRIVATE);
                  boolean alreadyAsked = prefs.getBoolean("asked_once", false);

                  if (!alreadyAsked && Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      prefs.edit().putBoolean("asked_once", true).apply();
                      List<String> needed = new ArrayList<>();

                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED) {
                          needed.add(Manifest.permission.CAMERA);
                      }
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                          if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_MEDIA_IMAGES) != PackageManager.PERMISSION_GRANTED) {
                              needed.add(Manifest.permission.READ_MEDIA_IMAGES);
                          }
                      } else {
                          if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_EXTERNAL_STORAGE) != PackageManager.PERMISSION_GRANTED) {
                              needed.add(Manifest.permission.READ_EXTERNAL_STORAGE);
                          }
                      }

                      if (!needed.isEmpty()) {
                          ActivityCompat.requestPermissions(this, needed.toArray(new String[0]), 101);
                      }
                  }
              }
          }
          EOF
          fi

      - name: 7. Configuration du SDK Android
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          accept-android-sdk-licenses: true

      - name: 8. Compilation de l'APK OptiStock Pro
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../OptiStock-Pro.apk

      - name: 9. Publication dans Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OptiStock-Pro-APK
          path: OptiStock-Pro.apk

      - name: 10. Publication automatique sur GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "OptiStock Pro — Dernière Version APK"
          files: OptiStock-Pro.apk
          prerelease: false
