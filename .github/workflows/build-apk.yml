name: Build OptiStock Pro APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Récupération du code source
        uses: actions/checkout@v4

      - name: 2. Installation de Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Installation de Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Préparation du dossier web et installation Capacitor
        run: |
          mkdir -p www
          cp index.html www/index.html
          npm install

      - name: 5. Génération et synchronisation du projet Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: 6. Permissions Android 14/15 sans avertissement + Relais Caméra/Fichiers
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "android.permission.CAMERA" "$MANIFEST"; then
            sed -i '/<application/i \    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />\n    <uses-permission android:name="android.permission.BLUETOOTH" />\n    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />\n    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />' "$MANIFEST"
          fi

          # Garantit targetSdkVersion 34 pour supprimer l'avertissement Android d'ancienne version
          if [ -f "android/variables.gradle" ]; then
            sed -i 's/targetSdkVersion = [0-9]*/targetSdkVersion = 34/g' android/variables.gradle
          fi

          # Demande groupée des autorisations dès l'ouverture sans écraser le FileChooser Capacitor
          MAIN_ACT=$(find android/app/src/main/java -name "MainActivity.java" | head -n 1)
          if [ -n "$MAIN_ACT" ]; then
            PKG_LINE=$(head -n 1 "$MAIN_ACT")
            cat << EOF > "$MAIN_ACT"
          $PKG_LINE

          import android.Manifest;
          import android.os.Build;
          import android.os.Bundle;
          import androidx.core.app.ActivityCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      ActivityCompat.requestPermissions(this, new String[]{
                          Manifest.permission.CAMERA,
                          Manifest.permission.READ_MEDIA_IMAGES,
                          Manifest.permission.BLUETOOTH_CONNECT,
                          Manifest.permission.BLUETOOTH_SCAN
                      }, 101);
                  } else if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      ActivityCompat.requestPermissions(this, new String[]{
                          Manifest.permission.CAMERA,
                          Manifest.permission.READ_EXTERNAL_STORAGE,
                          Manifest.permission.WRITE_EXTERNAL_STORAGE
                      }, 101);
                  }
              }
          }
          EOF
          fi

      - name: 7. Compilation de l'APK OptiStock Pro
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../OptiStock-Pro.apk

      - name: 8. Publication dans Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OptiStock-Pro-APK
          path: OptiStock-Pro.apk

      - name: 9. Publication automatique sur GitHub Releases (Lien direct de téléchargement)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "OptiStock Pro — Dernière Version APK"
          files: OptiStock-Pro.apk
          prerelease: false
