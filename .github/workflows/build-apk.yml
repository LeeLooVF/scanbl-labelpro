name: Build OptiStock Pro APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Récupération du code source
        uses: actions/checkout@v4

      - name: 2. Installation de Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Installation de Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Préparation du dossier web et installation Capacitor
        run: |
          mkdir -p www
          cp index.html www/index.html
          npm install

      - name: 5. Génération et synchronisation du projet Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: 6. Application de l'icône iconeOptiStock E.png, Permissions & Pont Natif
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick

          # Détecte "iconeOptiStock E.png" à la racine du dépôt GitHub
          FOUND_ICON=$(find . -maxdepth 1 -iname "*iconeoptistock*.png" -o -iname "icon.png" | head -n 1)
          if [ -n "$FOUND_ICON" ]; then
            cp "$FOUND_ICON" icon_source.png
          else
            convert -size 512x512 xc:"#090d16" icon_source.png
          fi

          # Copie l'icône dans www/ pour l'afficher aussi dans l'en-tête de l'application
          cp icon_source.png www/app-icon.png
          npx cap copy android

          # Supprime les fichiers XML adaptatifs et WebP par défaut qui masquent le PNG
          find android/app/src/main/res -name "ic_launcher*.xml" -delete
          find android/app/src/main/res -name "ic_launcher*.webp" -delete

          # Génère les résolutions exactes requises par le lanceur Android
          declare -A SIZES=( ["mipmap-mdpi"]=48 ["mipmap-hdpi"]=72 ["mipmap-xhdpi"]=96 ["mipmap-xxhdpi"]=144 ["mipmap-xxxhdpi"]=192 )
          for folder in "${!SIZES[@]}"; do
            TARGET="android/app/src/main/res/$folder"
            mkdir -p "$TARGET"
            SZ=${SIZES[$folder]}
            convert icon_source.png -resize ${SZ}x${SZ} "$TARGET/ic_launcher.png"
            convert icon_source.png -resize ${SZ}x${SZ} "$TARGET/ic_launcher_round.png"
            convert icon_source.png -resize ${SZ}x${SZ} "$TARGET/ic_launcher_foreground.png"
          done

          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "android.permission.CAMERA" "$MANIFEST"; then
            sed -i '/<application/i \    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />\n    <uses-permission android:name="android.permission.BLUETOOTH" />\n    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />\n    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />' "$MANIFEST"
          fi

          if [ -f "android/variables.gradle" ]; then
            sed -i 's/targetSdkVersion = [0-9]*/targetSdkVersion = 34/g' android/variables.gradle
          fi

          MAIN_ACT=$(find android/app/src/main/java -name "MainActivity.java" | head -n 1)
          if [ -n "$MAIN_ACT" ]; then
            PKG_LINE=$(head -n 1 "$MAIN_ACT")
            cat << EOF > "$MAIN_ACT"
          $PKG_LINE

          import android.Manifest;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.print.PrintAttributes;
          import android.print.PrintDocumentAdapter;
          import android.print.PrintManager;
          import android.util.Base64;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import androidx.core.content.FileProvider;
          import com.getcapacitor.BridgeActivity;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.util.ArrayList;
          import java.util.List;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  SharedPreferences prefs = getSharedPreferences("OptiStockPerms", MODE_PRIVATE);
                  boolean alreadyAsked = prefs.getBoolean("asked_once", false);

                  if (!alreadyAsked && Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      prefs.edit().putBoolean("asked_once", true).apply();
                      List<String> needed = new ArrayList<>();

                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED) {
                          needed.add(Manifest.permission.CAMERA);
                      }
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                          if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_MEDIA_IMAGES) != PackageManager.PERMISSION_GRANTED) {
                              needed.add(Manifest.permission.READ_MEDIA_IMAGES);
                          }
                      } else {
                          if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_EXTERNAL_STORAGE) != PackageManager.PERMISSION_GRANTED) {
                              needed.add(Manifest.permission.READ_EXTERNAL_STORAGE);
                          }
                      }

                      if (!needed.isEmpty()) {
                          ActivityCompat.requestPermissions(this, needed.toArray(new String[0]), 101);
                      }
                  }

                  if (this.bridge != null && this.bridge.getWebView() != null) {
                      this.bridge.getWebView().addJavascriptInterface(new AndroidPrintBridge(), "AndroidBridge");
                  }
              }

              public class AndroidPrintBridge {
                  @JavascriptInterface
                  public void printPage(final String jobName) {
                      runOnUiThread(() -> {
                          try {
                              WebView webView = MainActivity.this.bridge.getWebView();
                              PrintManager printManager = (PrintManager) getSystemService(Context.PRINT_SERVICE);
                              PrintDocumentAdapter adapter = webView.createPrintDocumentAdapter(jobName != null ? jobName : "OptiStock_Print");
                              printManager.print(jobName != null ? jobName : "OptiStock_Print", adapter, new PrintAttributes.Builder().build());
                          } catch (Exception e) {
                              e.printStackTrace();
                          }
                      });
                  }

                  @JavascriptInterface
                  public void openPdfBase64(final String base64Data, final String fileName) {
                      runOnUiThread(() -> {
                          try {
                              String clean = base64Data;
                              if (clean.contains(",")) {
                                  clean = clean.substring(clean.indexOf(",") + 1);
                              }
                              byte[] pdfBytes = Base64.decode(clean, Base64.DEFAULT);
                              File pdfFile = new File(getCacheDir(), fileName != null ? fileName : "Bon-Commande.pdf");
                              FileOutputStream fos = new FileOutputStream(pdfFile);
                              fos.write(pdfBytes);
                              fos.flush();
                              fos.close();

                              Uri uri = FileProvider.getUriForFile(MainActivity.this, getPackageName() + ".fileprovider", pdfFile);

                              Intent viewIntent = new Intent(Intent.ACTION_VIEW);
                              viewIntent.setDataAndType(uri, "application/pdf");
                              viewIntent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_ACTIVITY_NEW_TASK);

                              Intent chooser = Intent.createChooser(viewIntent, "Ouvrir le PDF avec...");
                              chooser.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                              startActivity(chooser);
                          } catch (Exception e) {
                              e.printStackTrace();
                          }
                      });
                  }
              }
          }
          EOF
          fi

      - name: 7. Configuration du SDK Android
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          accept-android-sdk-licenses: true

      - name: 8. Compilation de l'APK OptiStock Pro
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../OptiStock-Pro.apk

      - name: 9. Publication dans Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OptiStock-Pro-APK
          path: OptiStock-Pro.apk

      - name: 10. Publication automatique sur GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "OptiStock Pro — Dernière Version APK"
          files: OptiStock-Pro.apk
          prerelease: false
